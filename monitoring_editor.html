<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Settings Editor</title>
<!-- Relative paths: the page also works when opened straight from disk (offline defaults). -->
<link rel="icon" href="web/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="web/static/theme.css">
<script src="web/static/theme.js"></script>
<style>
body { display: flex; height: 100vh; overflow: hidden; }

/* ---- sidebar ---- */
#sidebar { width: 244px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 12px 16px; min-height: 56px; border-bottom: 1px solid var(--border); }
#nav { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 12px; font-weight: 650; color: var(--text-3); padding: 12px 10px 4px; }
.nb { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text-2); font-size: 13.5px; font-weight: 550; cursor: pointer; text-align: left; }
.nb:hover { background: var(--surface-2); color: var(--text); }
.nb.on { background: var(--accent-weak); color: var(--accent); }
.nb-label { flex: 1; }
.nbg { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--surface-3); color: var(--text-3); font-size: 12px; font-weight: 650; }
.nb.on .nbg { background: var(--accent); color: var(--accent-text); }
#stools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px; border-top: 1px solid var(--border); }
#stools .wide { grid-column: 1 / -1; }

/* ---- main ---- */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#topbar h2 { font-family: var(--font-display); font-size: 17px; font-weight: 650; }
#dirty { display: none; }
.demo-tag { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); padding: 3px 8px; border: 1px dashed var(--border-strong); border-radius: 6px; white-space: nowrap; }
@media (max-width: 560px) { .demo-tag { display: none; } }
#content { flex: 1; overflow-y: auto; padding: 24px; }
.content-inner { max-width: 1080px; margin: 0 auto; }
.panel { display: none; }
.panel.on { display: block; }

/* ---- collapsible cards ---- */
.card { margin-bottom: 16px; overflow: hidden; }
.ch { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; user-select: none; }
.ch:hover { background: var(--surface-2); }
.ch.open { border-bottom: 1px solid var(--border); }
.cv { display: inline-grid; place-items: center; color: var(--text-3); transition: transform .15s; }
.ch:not(.open) .cv, .th:not(.open) .cv { transform: rotate(-90deg); }
.ct { flex: 1; font-weight: 650; font-size: 14.5px; }
.cb { display: none; padding: 16px; }
.cb.open { display: block; }

/* ---- forms ---- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.full { grid-column: 1 / -1; }
.fg { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
input[type=text], input[type=number], input[type=email], select, textarea {
  width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--surface); color: var(--text); font-size: 13.5px; transition: border-color .12s, box-shadow .12s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
textarea { min-height: 76px; resize: vertical; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
.crow { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.crow label { font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.sechdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sechdr h3 { font-size: 14.5px; font-weight: 650; }
hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

/* ---- button variants used by the generated forms ---- */
.btn.pri, .btn.ok { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.pri:hover:not(:disabled), .btn.ok:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: var(--surface); }
.btn.dan { background: transparent; border-color: var(--border); color: var(--text-2); }
.btn.dan:hover:not(:disabled) { background: var(--crit-bg); border-color: var(--crit-bd); color: var(--crit); }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; }

/* ---- thresholds and actions ---- */
.badge.bw { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-bd); }
.badge.bc { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-bd); }
.tw { margin-bottom: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
.th { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; background: var(--surface-2); cursor: pointer; user-select: none; }
.th.open { border-bottom: 1px solid var(--border); }
.tb { display: none; padding: 14px; }
.tb.open { display: block; }
.ac { margin-bottom: 8px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.ah { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ah select { flex: 1; }
.atag { padding: 2px 8px; border-radius: 6px; background: var(--accent-weak); color: var(--accent); font-family: var(--mono); font-size: 12px; font-weight: 650; }
.afields { display: grid; gap: 10px; }

/* ---- messages ---- */
#toast { position: fixed; right: 20px; bottom: 20px; z-index: 999; padding: 10px 16px; border-radius: 10px; background: var(--tooltip-bg); color: var(--tooltip-text); font-size: 13px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: none; }
#no-server { display: none; margin-bottom: 16px; padding: 12px 14px; border: 1px solid var(--warn-bd); border-radius: 10px; background: var(--warn-bg); color: var(--text); font-size: 13px; }
#no-server code { font-weight: 600; }

/* ---- small screens: the sidebar becomes a scrolling tab strip ---- */
@media (max-width: 760px) {
  body { flex-direction: column; height: auto; overflow: visible; }
  #sidebar { width: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  #nav { flex-direction: row; overflow-x: auto; padding: 8px 12px; }
  .nb { width: auto; white-space: nowrap; }
  .nav-label, #stools { display: none; }
  #main { overflow: visible; }
  #content { overflow: visible; padding: 16px; }
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="side-brand">
    <div class="brand-mark" aria-hidden="true"><svg class="icon icon-lg" aria-hidden="true"><use href="web/static/icons.svg#i-logo"/></svg></div>
    <div><div class="brand-name">Settings Editor</div><div class="brand-sub">monitoring_settings.json</div></div>
  </div>
  <nav id="nav" aria-label="Sections">
    <div class="nav-label">General</div>
    <button class="nb on" onclick="showPanel('global',this)"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-sliders"/></svg><span class="nb-label">Global settings</span></button>
    <div class="nav-label">Monitors</div>
    <button class="nb" onclick="showPanel('processes',this)"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-process"/></svg><span class="nb-label">Processes</span><span class="nbg" id="bg-processes">1</span></button>
    <button class="nb" onclick="showPanel('cpu',this)"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-cpu"/></svg><span class="nb-label">CPU</span></button>
    <button class="nb" onclick="showPanel('memory',this)"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-memory"/></svg><span class="nb-label">Memory</span></button>
    <button class="nb" onclick="showPanel('disk',this)"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-disk"/></svg><span class="nb-label">Disk</span><span class="nbg" id="bg-disk">2</span></button>
    <button class="nb" onclick="showPanel('network',this)"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-network"/></svg><span class="nb-label">Network</span><span class="nbg" id="bg-network">2</span></button>
    <button class="nb" onclick="showPanel('document',this)"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-document"/></svg><span class="nb-label">Document</span><span class="nbg" id="bg-document">&#9679;</span></button>
  </nav>
  <div id="stools">

    <button class="btn btn-sm" onclick="exportCopy()" title="Download a copy of the JSON"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-download"/></svg>Export</button>
    <button class="btn btn-sm wide" onclick="copyJSON()"><svg class="icon " aria-hidden="true"><use href="web/static/icons.svg#i-copy"/></svg>Copy JSON</button>
  </div>
</aside>

<div id="main">
  <header id="topbar" class="app-header">
    <h2 id="ptitle">Global Settings</h2>
    <div class="header-actions">
      <span id="dirty" class="badge b-warn">Unsaved changes</span>

    <div id="panel-network" class="panel"></div>
    <div id="panel-document" class="panel"></div>
  </div></div>
</div>

<div id="toast"></div>

hostname} — {timestamp}","body_template":"Server: {hostname}\nTimestamp: {timestamp}\nTarget: {host}:{port}\nStatus: UNREACHABLE\n\nPossible internet outage or gateway failure. Please investigate immediately."},{"type":"run_script","path":"{global.scripts_dir}\\actions\\on_network_down.ps1","args":["--host","{host}"]}]}]},{"name":"Google DNS (TCP 53)","host":"8.8.8.8","port":53,"protocol":"tcp","timeout_sec":5,"check_interval_sec":60,"thresholds":[{"level":"warning","latency_ms":300,"description":"TCP connect slower than 300 ms","actions":[{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING NET: {host}:{port} connect {current_value}ms (threshold: {latency_ms}ms)"}]},{"level":"critical","condition":"unreachable","description":"TCP port 53 not reachable (internet down, or DNS blocked by a firewall)","actions":[{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL NET: {host}:{port} unreachable"}]}]},{"name":"Monitoring Console","host":"localhost","port":5758,"protocol":"tcp","timeout_sec":3,"check_interval_sec":15,"thresholds":[{"level":"critical","condition":"unreachable","description":"Monitoring console on port 5758 not responding","actions":[{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL SVC: localhost:5758 unreachable"},{"type":"run_script","path":"{global.scripts_dir}\\actions\\on_service_down.ps1","args":["--port","5758"]}]}]},{"name":"Settings Editor (demo)","host":"localhost","port":5757,"protocol":"tcp","timeout_sec":3,"check_interval_sec":30,"thresholds":[{"level":"warning","condition":"unreachable","description":"Demo: the settings editor is closed. Open it with start_editor.bat (or the console's banner) and this turns green.","actions":[{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING SVC: settings editor on localhost:5757 is not running (demo)"}]}]}],"document":{"display_name":"Groceries spend (monthly budget)","path":"sample_data\\monthly_budget_sample.csv","filter_column":"Category","filter_value":"Groceries","value_column":"Amount","target":400,"unit":"$","check_interval_sec":30,"thresholds":[{"level":"warning","condition":"above","percent_of_target":80,"description":"Groceries spend above 80% of the monthly budget","actions":[{"type":"log_to_file","level":"warning","message_template":"[{timestamp}] WARNING DOC: {document} at {unit}{current_value} ({current_percent}% of {unit}{target}; threshold {percent_of_target}%)"}]},{"level":"critical","condition":"above","percent_of_target":100,"description":"Groceries budget used up","actions":[{"type":"log_to_file","level":"critical","message_template":"[{timestamp}] CRITICAL DOC: {document} at {unit}{current_value} ({current_percent}% of {unit}{target}; threshold {percent_of_target}%)"},{"type":"popup","title":"Budget alert: {document}","message_template":"{document} is at {unit}{current_value}, {current_percent}% of the {unit}{target} budget."},{"type":"email_draft","to":"{global.email_recipient}","subject_template":"[CRITICAL] {document} over budget on {hostname} — {timestamp}","body_template":"Document: {document}\nTimestamp: {timestamp}\nCurrent total: {unit}{current_value}\nTarget: {unit}{target}\nUsed: {current_percent}%\nThreshold: {percent_of_target}%\n\nReview the spending in the source file."}]}]},"others":{"_comment":"Pending to define. Add new monitoring sections here following the same pattern: name, check_interval_sec, thresholds [ { level, condition/value, actions [] } ]","items":[]}};

let S = JSON.parse(JSON.stringify(DEFAULT_DATA));
let serverAvailable = false;

// ─── Helpers ─────────────────────────────────────────────────────────────────
const esc  = s => String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escT = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const clone = o => JSON.parse(JSON.stringify(o));

function markDirty(){ document.getElementById('dirty').style.display='inline-flex'; }
function clearDirty(){ document.getElementById('dirty').style.display='none'; }

let toastTimer;
function toast(msg, ms=2800){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms);
}

function gp(path){ return path.split('.').reduce((o,k)=>o[isNaN(k)?k:+k],S); }
function sp(path,val){
  const p=path.split('.'), last=p.pop();
  const o=p.reduce((o,k)=>o[isNaN(k)?k:+k],S);
  o[isNaN(last)?last:+last]=val;
}

// ─── Input delegation ────────────────────────────────────────────────────────
document.getElementById('content').addEventListener('input', e=>{
  const p=e.target.dataset.p; if(!p) return;
  let v=e.target.type==='number'?+e.target.value:
        e.target.dataset.lines?e.target.value.split('\n').filter(x=>x.trim()):
        e.target.value;
  sp(p,v); markDirty();
});
document.getElementById('content').addEventListener('change', e=>{
  const p=e.target.dataset.p; if(!p) return;
  let v=e.target.type==='checkbox'?e.target.checked:
        e.target.type==='number'?+e.target.value:e.target.value;
  sp(p,v); markDirty();
});

// ─── Toggle card / threshold ─────────────────────────────────────────────────
function tog(hdr){
  hdr.classList.toggle('open');
  hdr.nextElementSibling.classList.toggle('open');
  hdr.setAttribute('aria-expanded', hdr.classList.contains('open'));
}

// ─── Accessibility pass (runs after every render) ────────────────────────────
// The forms are generated as <label>…</label><input> pairs; link each label to
// its field, name the action-type pickers, and make the collapsible headers
// focusable buttons that open with Enter or Space.
let _fieldId=0;
function a11yPass(){
  document.querySelectorAll('#content .fg > label').forEach(l=>{
    if(l.htmlFor) return;
    const ctl=l.parentElement.querySelector('input,select,textarea');
    if(!ctl) return;
    if(!ctl.id) ctl.id='fld'+(++_fieldId);
    l.htmlFor=ctl.id;
  });
  document.querySelectorAll('#content .ah select:not([aria-label])').forEach(s=>s.setAttribute('aria-label','Action type'));
  document.querySelectorAll('#content .ch, #content .th').forEach(h=>{
    if(!h.hasAttribute('tabindex')){ h.tabIndex=0; h.setAttribute('role','button'); }
    h.setAttribute('aria-expanded', h.classList.contains('open'));
  });
}
document.getElementById('content').addEventListener('keydown', e=>{
  const h=e.target.closest('.ch,.th');
  if(h && e.target===h && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); tog(h); }
});

// ─── Navigation ──────────────────────────────────────────────────────────────
const TITLES={global:'Global Settings',processes:'Processes',cpu:'CPU Performance',memory:'Memory Performance',disk:'Disk Monitoring',network:'Network Monitoring',document:'Document Monitoring'};
function showPanel(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('panel-'+id).classList.add('on');
  btn.classList.add('on');
  document.getElementById('ptitle').textContent=TITLES[id];
}

function updateBadges(){

// ─── Action rendering ────────────────────────────────────────────────────────
const ACTION_DEFAULTS={
  popup:{type:'popup',title:'',message_template:''},
  log_to_file:{type:'log_to_file',level:'warning',message_template:''},
  email_draft:{type:'email_draft',to:'',subject_template:'',body_template:''},
  run_script:{type:'run_script',path:'',args:[]}
};

function actionFields(a,ap,sec){
  // Processes use 'instructions' as the field name; all other sections use 'message_template'.
  const isProc=sec==='processes';
  const msgField=isProc?'instructions':'message_template';
  const msgLabel=isProc?'Instructions':'Message Template';
  switch(a.type){
    case 'popup': return `
      <div class="fg"><label>Title</label><input type="text" value="${esc(a.title)}" data-p="${ap}.title"></div>
      <div class="fg"><label>${msgLabel}</label><textarea data-p="${ap}.${msgField}">${escT(a[msgField])}</textarea></div>`;
    case 'log_to_file': return `
      <div class="fg"><label>Log Level</label>
        <select data-p="${ap}.level">${['info','warning','error','critical'].map(l=>`<option${l===a.level?' selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="fg"><label>${msgLabel}</label><textarea data-p="${ap}.${msgField}">${escT(a[msgField])}</textarea></div>`;
    case 'email_draft': return `
      <div class="fg"><label>To</label><input type="text" value="${esc(a.to)}" data-p="${ap}.to"></div>
      <div class="fg"><label>Subject Template</label><input type="text" value="${esc(a.subject_template)}" data-p="${ap}.subject_template"></div>
      <div class="fg full"><label>Body Template</label><textarea style="min-height:90px" data-p="${ap}.body_template">${escT(a.body_template)}</textarea></div>`;
    case 'run_script': return `
      <div class="fg"><label>Script Path</label><input type="text" value="${esc(a.path)}" data-p="${ap}.path"></div>
      <div class="fg"><label>Args (one per line)</label><textarea data-p="${ap}.args" data-lines="1">${escT((a.args||[]).join('\n'))}</textarea></div>`;
    default: return '';
  }
}

function renderAction(a,arrPath,idx,sec){
  const ap=`${arrPath}.${idx}`;
  const types=['popup','log_to_file','email_draft','run_script'];
  return `<div class="ac">
    <div class="ah">
      <span class="atag">${a.type}</span>
      <select onchange="changeActType('${arrPath}',${idx},'${sec}',this.value)">
        ${types.map(t=>`<option value="${t}"${t===a.type?' selected':''}>${t}</option>`).join('')}
      </select>
      <button class="btn dan sm" onclick="rmAction('${arrPath}',${idx},'${sec}')" title="Remove">${ico('trash')}Remove</button>
    </div>
    <div class="afields grid">${actionFields(a,ap,sec)}</div>
  </div>`;
}

function renderActions(actions,arrPath,sec){
  return (actions||[]).map((a,i)=>renderAction(a,arrPath,i,sec)).join('');
}

function procAction(defaults,sec){
  // For the processes section swap message_template -> instructions on the default object.
  if(sec!=='processes') return defaults;
  const d=clone(defaults);
  if('message_template' in d){ d.instructions=d.message_template; delete d.message_template; }
  return d;
}
function addAction(arrPath,sec){
  const openCards=sec==='processes'?getOpenProcessCards():null;
  gp(arrPath).push(procAction(clone(ACTION_DEFAULTS.log_to_file),sec));
  rerender(sec,openCards); markDirty();
}
function rmAction(arrPath,idx,sec){
  const openCards=sec==='processes'?getOpenProcessCards():null;
  gp(arrPath).splice(idx,1);
  rerender(sec,openCards); markDirty();
}
function changeActType(arrPath,idx,sec,type){
  const openCards=sec==='processes'?getOpenProcessCards():null;
  const cur=gp(`${arrPath}.${idx}`);
  const nw=procAction(clone(ACTION_DEFAULTS[type]),sec);
  // Preserve the existing text content when switching type.
  const prevText=cur.instructions??cur.message_template??'';
  if('instructions' in nw) nw.instructions=prevText;
  else if('message_template' in nw) nw.message_template=cur.message_template??'';
  gp(arrPath)[idx]=nw;
  rerender(sec,openCards); markDirty();
}

// ─── Threshold rendering ─────────────────────────────────────────────────────
function thresholdMetricFields(t,tp,kind){
  if(kind==='perf') return `
    <div class="fg"><label>Level</label>
      <select data-p="${tp}.level">${['warning','critical'].map(l=>`<option${l===t.level?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Percent (%)</label><input type="number" value="${esc(t.percent)}" data-p="${tp}.percent"></div>
    <div class="fg"><label>Sustain (sec)</label><input type="number" value="${esc(t.sustain_sec)}" data-p="${tp}.sustain_sec"></div>
    <div class="fg full"><label>Description</label><input type="text" value="${esc(t.description)}" data-p="${tp}.description"></div>`;
  if(kind==='disk') return `
    <div class="fg"><label>Level</label>
      <select data-p="${tp}.level">${['warning','critical'].map(l=>`<option${l===t.level?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Percent Used (%)</label><input type="number" value="${esc(t.percent_used)}" data-p="${tp}.percent_used"></div>
    <div class="fg full"><label>Description</label><input type="text" value="${esc(t.description)}" data-p="${tp}.description"></div>`;
  if(kind==='net') return `
    <div class="fg"><label>Level</label>
      <select data-p="${tp}.level">${['warning','critical'].map(l=>`<option${l===t.level?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Condition</label>
      <select onchange="netThreshKind('${tp}',this.value,'network')">
        <option value="latency"${t.latency_ms!==undefined?' selected':''}>latency_ms</option>
        <option value="unreachable"${t.condition==='unreachable'?' selected':''}>unreachable</option>
      </select>
    </div>
    ${t.latency_ms!==undefined?`<div class="fg"><label>Latency (ms)</label><input type="number" value="${esc(t.latency_ms)}" data-p="${tp}.latency_ms"></div>`:''}
    <div class="fg full"><label>Description</label><input type="text" value="${esc(t.description)}" data-p="${tp}.description"></div>`;
  if(kind==='doc') return `
    <div class="fg"><label>Level</label>
      <select data-p="${tp}.level">${['warning','critical'].map(l=>`<option${l===t.level?' selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Condition</label>
      <select data-p="${tp}.condition">${['above','below'].map(c=>`<option${c===(t.condition||'above')?' selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div class="fg"><label>Percent of Target (%)</label><input type="number" value="${esc(t.percent_of_target)}" data-p="${tp}.percent_of_target"></div>
    <div class="fg full"><label>Description</label><input type="text" value="${esc(t.description)}" data-p="${tp}.description"></div>`;
  return '';
}

function renderThreshold(t,arrPath,idx,sec,kind){
  const tp=`${arrPath}.${idx}`;
  const badgeCls=t.level==='critical'?'bc':'bw';
  const label=kind==='perf'?`${t.level} — ${t.percent}%`:
               kind==='disk'?`${t.level} — ${t.percent_used}% used`:
               kind==='doc'?`${t.level} — ${t.condition||'above'} ${t.percent_of_target}% of target`:
               `${t.level}${t.latency_ms!==undefined?' — '+t.latency_ms+'ms':' — unreachable'}`;
  return `<div class="tw">
    <div class="th" onclick="tog(this)">
      <span class="cv">${ico('chevron')}</span>
      <span class="badge ${badgeCls}">${t.level}</span>
      <span style="font-size:13px;flex:1">${esc(label)}</span>
      <button class="btn dan sm" onclick="event.stopPropagation();rmThresh('${arrPath}',${idx},'${sec}')" title="Remove threshold" aria-label="Remove threshold">${ico('trash')}</button>
    </div>
    <div class="tb">
      <div class="grid">${thresholdMetricFields(t,tp,kind)}</div>
      <hr>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <strong style="font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">Actions</strong>
        <button class="btn ghost sm" onclick="addAction('${tp}.actions','${sec}')">+ Add Action</button>
      </div>
      ${renderActions(t.actions,`${tp}.actions`,sec)}
    </div>
  </div>`;
}

function renderThresholds(thresholds,arrPath,sec,kind){
  return (thresholds||[]).map((t,i)=>renderThreshold(t,arrPath,i,sec,kind)).join('');
}

function addThresh(arrPath,sec,kind){
  const defaults={perf:{level:'warning',percent:50,sustain_sec:5,description:'',actions:[]},
    disk:{level:'warning',percent_used:80,description:'',actions:[]},
    net:{level:'warning',latency_ms:100,description:'',actions:[]},
    doc:{level:'warning',condition:'above',percent_of_target:80,description:'',actions:[]}};
  gp(arrPath).push(clone(defaults[kind]));
  rerender(sec); markDirty();
}
function rmThresh(arrPath,idx,sec){
  gp(arrPath).splice(idx,1);
  rerender(sec); markDirty();
}
function netThreshKind(tp,val,sec){
  const t=gp(tp);
  if(val==='unreachable'){ delete t.latency_ms; t.condition='unreachable'; }
  else { delete t.condition; t.latency_ms=100; }
  rerender(sec); markDirty();
}

// Returns the set of process-card indices that are currently expanded.
function getOpenProcessCards(){
  const open=new Set();
  document.querySelectorAll('#panel-processes .card').forEach((card,i)=>{
    if(card.querySelector('.ch.open')) open.add(i);
  });
  return open;
}

// Renders the Processes panel. openSet (optional Set<number>) restores which
// cards are expanded — all others start collapsed.
function renderProcesses(openSet){
  const procs=S.processes;
  document.getElementById('panel-processes').innerHTML=`
  <div class="sechdr">
    <h3>Monitored Processes (${procs.length})</h3>
    <button class="btn pri sm" onclick="addProcess()">+ Add Process</button>
  </div>
  ${procs.map((p,i)=>`
  <div class="card">
    <div class="ch" onclick="tog(this)">
      <span class="cv">${ico('chevron')}</span>
      <span class="ct">${esc(p.display_name||p.name||'New Process')}</span>
      <button class="btn dan sm" onclick="event.stopPropagation();rmProcess(${i})" title="Remove">${ico('trash')}Remove</button>
    </div>
    <div class="cb">
      <div class="grid">
        <div class="fg"><label>Process Name (exe)</label><input type="text" value="${esc(p.name)}" data-p="processes.${i}.name"></div>
        <div class="fg"><label>Display Name</label><input type="text" value="${esc(p.display_name)}" data-p="processes.${i}.display_name"></div>
        <div class="fg"><label>Check Interval (sec)</label><input type="number" value="${p.check_interval_sec}" data-p="processes.${i}.check_interval_sec"></div>
        <div class="fg" style="justify-content:flex-end"><div class="crow"><input type="checkbox" id="req${i}"${p.required?' checked':''} data-p="processes.${i}.required"><label for="req${i}">Required (alert if not running)</label></div></div>
      </div>
      <hr>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <strong style="font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em">Actions: On Not Running</strong>
        <button class="btn ghost sm" onclick="addAction('processes.${i}.actions.on_not_running','processes')">+ Add Action</button>
      </div>
      ${renderActions(p.actions.on_not_running,`processes.${i}.actions.on_not_running`,'processes')}
    </div>
  </div>`).join('')}`;
  // Restore expanded state without touching cards that should stay collapsed.
  if(openSet&&openSet.size>0){
    const cards=document.querySelectorAll('#panel-processes .card');
    openSet.forEach(i=>{
      if(!cards[i]) return;
      cards[i].querySelector('.ch').classList.add('open');
      cards[i].querySelector('.cb').classList.add('open');
    });
  }
  updateBadges();
}

function addProcess(){
  // New process goes to the top (unshift) and starts expanded (index 0).
  // Existing open cards shift down by 1.
  const prevOpen=getOpenProcessCards();
  const newOpen=new Set([0]);
  prevOpen.forEach(i=>newOpen.add(i+1));
  S.processes.unshift({name:'',display_name:'New Process',required:false,check_interval_sec:30,actions:{on_not_running:[]}});
  renderProcesses(newOpen); markDirty();
}
function rmProcess(i){
  if(confirm('Remove this process?')){
    const prevOpen=getOpenProcessCards();
    const newOpen=new Set();
    prevOpen.forEach(idx=>{ if(idx<i) newOpen.add(idx); else if(idx>i) newOpen.add(idx-1); });
    S.processes.splice(i,1);
    renderProcesses(newOpen); markDirty();
  }
}

function rerender(sec,openCards){
  if(sec==='global') renderGlobal();
  else if(sec==='processes') renderProcesses(openCards);
  else if(sec==='cpu') renderPerf('cpu');
  else if(sec==='memory') renderPerf('memory');
  else if(sec==='disk') renderDisk();
  else if(sec==='network') renderNetwork();
  else if(sec==='document') renderDocument();
  updateBadges();
}

function renderAll(){
  renderGlobal(); renderProcesses();
  renderPerf('cpu'); renderPerf('memory');
  renderDisk(); renderNetwork();
  renderDocument();
  updateBadges();
}

// ─── Server API ───────────────────────────────────────────────────────────────
function getJSON(){
  S._meta.last_updated = new Date().toISOString().slice(0,10);
  return JSON.stringify(S, null, 2);
}

function setSaveBusy(busy){
  ['btn-save','btn-save-top'].forEach(id=>{
    const b=document.getElementById(id); if(!b) return;
    b.disabled=busy;
    b.innerHTML=busy?ico('refresh')+'Saving&hellip;':ico('save')+'Save changes';
  });
}

async function saveSettings(){
  if(!serverAvailable){ toast('Server not running — launch start_editor.bat to enable saving.', 4000); return; }
  try{
    setSaveBusy(true);
    const res=await fetch('/api/settings',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:getJSON()
    });
    if(!res.ok) throw new Error(`Server responded ${res.status}`);
    // Re-read from server so UI reflects exactly what was written to disk
    const saved=await fetch('/api/settings');
    S=await saved.json();
    renderAll();
    clearDirty();
    toast('✓ Saved to monitoring_settings.json');
  }catch(err){
    toast('Save failed: '+err.message, 4000);
  }finally{
    setSaveBusy(false);
  }
}

async function reloadSettings(){
  if(!serverAvailable){ toast('Server not running.', 3000); return; }
  if(document.getElementById('dirty').style.display!=='none'){
    if(!confirm('Discard unsaved changes and reload from file?')) return;
  }
  try{
    const res=await fetch('/api/settings');
    S=await res.json();
    renderAll(); clearDirty();
    toast('Reloaded from monitoring_settings.json');
  }catch(err){
    toast('Reload failed: '+err.message, 4000);
  }
}

// ─── Export / Copy (no server needed) ────────────────────────────────────────
function exportCopy(){
  const blob=new Blob([getJSON()],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='monitoring_settings.json'; a.click();
  toast('Copy downloaded');
}

function copyJSON(){
  navigator.clipboard.writeText(getJSON())
    .then(()=>toast('JSON copied to clipboard'))
    .catch(()=>toast('Copy failed',3000));
}

// ─── Ctrl+S ───────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveSettings(); }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init(){
  try{
    const res=await fetch('/api/settings');
    if(res.ok){
      S=await res.json();
      serverAvailable=true;
    }
  }catch{
    // Running without the server — show banner, disable Save
    document.getElementById('no-server').style.display='block';
    document.getElementById('btn-save').disabled=true;
    document.getElementById('btn-reload').disabled=true;
  }
  renderAll();
}

init();
</script>
